 const f=g('forma');
 if(f=='parc'){const N=parseInt(g('np'));if(!(N>=2&&N<=60))return alert('Informe de 2 a 60 parcelas.');if(v<=0)return alert('Informe o valor total da compra.');const d1=g('d1')||g('data');
  criarParcelado({desc:g('desc'),data:d1,tipo:g('tipo'),cat:g('cat'),pessoa:g('pessoa'),conta:g('conta'),pago:$('a_pago').checked,extra},v,N);aprender({desc:g('desc'),cat:g('cat'),tipo:g('tipo')});
  setSt(`Compra de ${fm(v)} em ${N}x lançada: 1ª parcela e ${N-1} previstas nos meses seguintes.`);S.mes=d1.slice(0,7);auto();render();return}
 if(f=='and'&&!parcP(g('parcela')))return alert('Informe a parcela atual no formato 03/10.');
 const rec=mk({mes:g('data').slice(0,7),data:g('data'),desc:g('desc'),valor:v,tipo:g('tipo'),cat:g('cat'),pessoa:g('pessoa'),conta:g('conta'),parcela:f=='and'?g('parcela'):'',pago:$('a_pago').checked,extra});S.base.push(rec);const np=projetar(rec);if(np)setSt(np+' parcelas futuras previstas lançadas nos meses seguintes.');S.mes=g('data').slice(0,7);auto();render()}
const tg=id=>{const r=S.base.find(x=>x.id==id);r.pago=!r.pago;auto();render()},del=id=>{const r=S.base.find(x=>x.id==id);let rm=[String(id)];if(r&&r.gp&&parcP(r.parcela)){const f=S.base.filter(x=>x.gp==r.gp&&x.prevista&&String(x.id)!=String(id)&&parcP(x.parcela)&&parcP(x.parcela).n>parcP(r.parcela).n);if(f.length&&confirm('Excluir também as '+f.length+' parcelas futuras previstas desta compra?'))rm=rm.concat(f.map(x=>String(x.id)))}S.base=S.base.filter(x=>!rm.includes(String(x.id)));auto();render()};

 <p><button class="p" onclick="confirmarImp()">Conferi — aplicar à base (${S.imp.length} linhas)</button> <button class="s" onclick="S.imp=[];render()">Limpar</button></p></div>`:''}`}
function csv(){const t='data;descricao;valor;tipo;categoria;pessoa;conta;parcela;pago\n'+dd().map(r=>[r.data,r.desc,String(r.valor).replace('.',','),r.tipo,r.cat,r.pessoa,r.conta,r.parcela,r.pago?'sim':'não'].join(';')).join('\n');

function cfg(){const T=(k,t,h)=>`<div class="card"><h2>${t}</h2><p class="mut">${h}</p><textarea id="c_${k}">${E(S.cfg[k])}</textarea></div>`;
 return`<div class="card"><h2>Geral</h2><div class="f"><label>Ano<input id="c_ano" type="number" value="${S.cfg.ano}"></label><label>Divisão do restante<select id="c_divisao"><option ${S.cfg.divisao=='proporcional'?'selected':''}>proporcional</option><option ${S.cfg.divisao=='igual'?'selected':''}>igual</option></select></label><label>Tolerância de conciliação (R$)<input id="c_tol" type="number" step="0.01" value="${S.cfg.tol}"></label></div></div>

 <div class="card"><h2>Layouts de bancos (perfis)</h2><p class="mut">Gravados na base. JSON com nome, detecção (det), ruído a remover, limpeza de descrição e opções (secao). Edite ou acrescente bancos.</p><textarea id="c_perfis" style="min-height:220px;font:12px monospace">${E(JSON.stringify(getPerfis(),null,1))}</textarea><p><button class="s" onclick="restaurarPerfis()">Restaurar layouts padrão</button> <button class="s" onclick="regrasPadrao()">Adicionar regras e categorias padrão</button></p></div>
 <button class="p" onclick="saveCfg()">Salvar configuração</button>`}

 ['ano','divisao','tol','cats','pessoas','rendas','contas','extras','regras','titulares','perfis'].forEach(k=>{const v=$('c_'+k).value;S.cfg[k]=k=='ano'||k=='tol'?+v:v});refreshBK();auto();setSt('Configuração salva.');render()}

function regrasPadrao(){const cur=L('regras'),ks=cur.map(l=>norm(l.split('=')[0])),add=DEF.regras.split('\n').filter(l=>!ks.includes(norm(l.split('=')[0])));
 S.cfg.regras=cur.map(l=>/^gás=/i.test(l)?l.replace(/^gás=/i,'gás$='):l).concat(add).join('\n');const c=L('cats');DEF.cats.split('\n').forEach(x=>{if(!c.includes(x))c.push(x)});S.cfg.cats=c.join('\n');auto();setSt('Regras e categorias padrão adicionadas.');render()}
/* ===== consulta com filtros e agrupamento ===== */
const SC='(sem conta)',todasContas=()=>[...new Set([...L('contas'),...S.base.map(r=>r.conta).filter(Boolean)])].concat(SC);
function fdata(){const f=S.fl,q=norm(f.q);return S.base.filter(r=>(!f.de||r.data>=f.de)&&(!f.ate||r.data<=f.ate)&&(!q||norm(r.desc).includes(q))&&(!f.cat||r.cat==f.cat)&&(!f.tipo||r.tipo==f.tipo)&&(!f.pessoa||r.pessoa==f.pessoa)&&(!f.pago||String(!!r.pago)==f.pago)&&(!f.contas.length||f.contas.includes(r.conta||SC))).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0)}
const sf=(k,v)=>{S.fl[k]=v;render()},tc=c=>{const a=S.fl.contas,i=a.indexOf(c);i<0?a.push(c):a.splice(i,1);render()};
function limpaF(){S.fl={de:'',ate:'',q:'',cat:'',tipo:'',pessoa:'',pago:'',contas:[],agr:S.fl.agr};render()}

function con(){const f=S.fl,d=fdata(),key=r=>f.agr=='conta'?(r.conta||SC):f.agr=='categoria'?(r.cat||'Outros'):f.agr=='pessoa'?(r.pessoa||'(sem pessoa)'):r.mes;
 const G={};d.forEach(r=>(G[key(r)]=G[key(r)]||[]).push(r));const ks=Object.keys(G).sort(),sel=(k,a,ph)=>`<select onchange="sf('${k}',this.value)"><option value="">${ph}</option>${a.map(x=>`<option ${x==f[k]?'selected':''}>${E(x)}</option>`).join('')}</select>`;
 return`<div class="card"><h2>Consulta de lançamentos</h2><div class="f">
 <label>De<input type="date" value="${f.de}" onchange="sf('de',this.value)"></label><label>Até<input type="date" value="${f.ate}" onchange="sf('ate',this.value)"></label>
 <label>Despesa contém<input value="${E(f.q)}" placeholder="ex: netflix" onchange="sf('q',this.value)"></label>
 <label>Categoria${sel('cat',L('cats'),'Todas')}</label><label>Pessoa${sel('pessoa',L('pessoas'),'Todas')}</label>
 <label>Tipo<select onchange="sf('tipo',this.value)"><option value="">Todos</option><option value="fixa" ${f.tipo=='fixa'?'selected':''}>Fixa</option><option value="variavel" ${f.tipo=='variavel'?'selected':''}>Variável</option></select></label>
 <label>Situação<select onchange="sf('pago',this.value)"><option value="">Todas</option><option value="true" ${f.pago=='true'?'selected':''}>Pago</option><option value="false" ${f.pago=='false'?'selected':''}>A pagar</option></select></label>
 <label>Separar por<select onchange="sf('agr',this.value)">${[['conta','Banco / cartão'],['categoria','Categoria'],['pessoa','Pessoa'],['mes','Mês']].map(([v,t])=>`<option value="${v}" ${f.agr==v?'selected':''}>${t}</option>`).join('')}</select></label></div>
 <p><b>Bancos / cartões</b> <span class="mut">(nenhum marcado = todos)</span><br>${todasContas().map(c=>`<label style="margin-right:10px"><input type="checkbox" ${f.contas.includes(c)?'checked':''} onchange="tc('${E(c).replace(/'/g,"\\'")}')"> ${E(c)}</label>`).join('')}</p>
 <button class="s" onclick="limpaF()">Limpar filtros</button> <button class="s" onclick="inferirContas()">Associar contas pela descrição</button> <button class="s" onclick="csvF()">Exportar CSV</button></div>
 <div class="card w"><h2>Resumo por ${({conta:'banco / cartão',categoria:'categoria',pessoa:'pessoa',mes:'mês'})[f.agr]}</h2><table><tr><th>Grupo<th class=n>Qtde<th class=n>Total<th class=n>Pago<th class=n>A pagar</tr>
 ${ks.map(k=>`<tr><td>${E(k)}<td class=n>${G[k].length}<td class=n>${fm(sum(G[k]))}<td class=n>${fm(sum(G[k].filter(r=>r.pago)))}<td class=n>${fm(sum(G[k].filter(r=>!r.pago)))}`).join('')||'<tr><td colspan=5 class=mut>Nenhum lançamento com esses filtros.'}
 <tr><th>Total geral<th class=n>${d.length}<th class=n>${fm(sum(d))}<th class=n>${fm(sum(d.filter(r=>r.pago)))}<th class=n>${fm(sum(d.filter(r=>!r.pago)))}</tr></table></div>
 ${ks.map(k=>`<details class="card" open><summary><b>${E(k)}</b> — ${fm(sum(G[k]))} (${G[k].length})</summary><div class="w"><table><tr><th>Data<th>Descrição<th>Categoria<th>Pessoa<th>Tipo<th>Parc.<th class=n>Valor<th>Pago</tr>${G[k].map(r=>`<tr class="clk" onclick="edit('${r.id}')"><td>${E(r.data)}<td>${dsc(r)}<td>${E(r.cat)}<td>${E(r.pessoa)}<td>${r.tipo}<td>${pf(r)}<td class=n>${fm(r.valor)}<td>${r.pago?'✓':''}`).join('')}</table></div></details>`).join('')}`}

 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='consulta.csv';a.click()}
try{const b=JSON.parse(localStorage.getItem('gastos_bkp')||'null');if(b){S.cfg={...DEF,...b.cfg};S.base=b.base||[]}}catch(e){}

/* ===== captura por câmera: OCR local, a imagem é descartada ===== */
function lerNota(t){
 const Ls=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),val=s=>[...s.matchAll(/(\d{1,3}(?:\.\d{3})*|\d+)[,.](\d{2})(?!\d)/g)].map(m=>parseFloat(m[1].replace(/\./g,'')+'.'+m[2]));
 let total=null;
 for(const l of Ls){if(/(valor\s*(total|a\s*pagar|pago)|total\s*(a\s*pagar|geral|r\$)?|vl\.?\s*total)/i.test(l)&&!/(desc|troco|tribut|imposto)/i.test(l)){const v=val(l);if(v.length){total=v[v.length-1];break}}}
 if(total==null){const a=val(t);if(a.length)total=Math.max(...a)}
 let data='';const m=t.match(/\b(\d{2})[\/.-](\d{2})[\/.-](\d{4}|\d{2})\b/);
 if(m&&+m[2]>=1&&+m[2]<=12&&+m[1]>=1&&+m[1]<=31){const y=m[3].length==2?2000+ +m[3]:+m[3];data=y+'-'+m[2]+'-'+m[1]}
 const nome=(Ls.find(l=>l.length>=4&&/[A-Za-zÀ-ú]{4,}/.test(l)&&!/(cnpj|cpf|cupom|nota|documento|danfe|nfc|extrato|www|http|^\d)/i.test(l))||'').replace(/[^A-Za-zÀ-ú0-9 &.\-]/g,' ').replace(/\s+/g,' ').trim().slice(0,40);
 return{total,data,nome}}
function aplicarNota(r){const set=(i,v)=>{const e=$('a_'+i);if(e&&v!=null&&v!=='')e.value=v};
 set('data',r.data);set('desc',r.nome);set('valor',r.total!=null?r.total.toFixed(2):'');
 if(r.nome){const c=classify(r.nome);if(c.cat!='Outros'){set('cat',c.cat);set('tipo',c.tipo)}}formaUI()}
async function lerImagem(f){const st=$('a_ocr');if(!f||!st)return;
 try{st.textContent='Preparando imagem…';
  const bm=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);const g=c.getContext('2d');g.drawImage(bm,0,0,c.width,c.height);if(bm.close)bm.close();
  const im=g.getImageData(0,0,c.width,c.height),d=im.data;for(let i=0;i<d.length;i+=4){const y=Math.max(0,Math.min(255,((.3*d[i]+.59*d[i+1]+.11*d[i+2])-128)*1.4+128));d[i]=d[i+1]=d[i+2]=y}g.putImageData(im,0,0);
  if(!window.Tesseract)throw new Error('leitor de texto não carregou (precisa de internet na primeira vez)');
  const w=await Tesseract.createWorker('por',1,{logger:m=>{if(m.status=='recognizing text'&&$('a_ocr'))$('a_ocr').textContent='Lendo… '+Math.round(m.progress*100)+'%'}});
  const{data}=await w.recognize(c);await w.terminate();c.width=c.height=0;
  const r=lerNota(data.text);if(!$('a_ocr'))return;aplicarNota(r);
  $('a_txt').textContent=data.text;$('a_dt').style.display='';
  $('a_ocr').innerHTML='<b class=ok>Lido.</b> Confira data, descrição e valor antes de adicionar. A imagem foi descartada.'}
 catch(e){if($('a_ocr'))$('a_ocr').textContent='Não consegui ler: '+e.message}}
['fc','fg'].forEach(id=>$(id).onchange=e=>{const f=e.target.files[0];e.target.value='';lerImagem(f)});
init();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
